[versions]
kotlin = "2.3.0"
kotlinx-serialization = "1.10.0"
okhttp = "5.3.2"

[libraries]
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serializationPlugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }

kotlinx-coroutines-core = "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"

kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

clikt = "com.github.ajalt.clikt:clikt:5.1.0"
cardiologist = "io.github.kevincianfarini.cardiologist:cardiologist:0.8.0"

okhttp-core = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

junit = "junit:junit:4.13.2"
jimfs = "com.google.jimfs:jimfs:1.3.1"
assertk = "com.willowtreeapps.assertk:assertk:0.28.1"
